# Site settings for Jekyll. After changing this file, stop (Ctrl + C) and
# restart `jekyll serve`, because Jekyll only reads it at startup.
title: Matthew Freriks
description: Biomedical engineering and biotechnology student at Swinburne University of Technology, with five years of experience working in Victorian hospitals.
url: https://matthewfreriks.com
timezone: Australia/Melbourne

# Blog post addresses look like /blog/2024/socaity/
permalink: /blog/:year/:title/

# Projects: each file in _projects becomes a page at /projects/file-name/
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Every project page uses the project layout automatically
# Settings applied automatically, based on where a file lives
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "_projects/complete"
    values:
      status: done
  - scope:
      path: "_projects/in-progress"
    values:
      status: progress
  - scope:
      path: "_projects/planned"
    values:
      status: planned

tags: [health-technology, biosignals, signal-processing, image-processing, embedded-systems, python]

# Files Jekyll should not copy into the built site
exclude:
  - README.md
  - .gitignore
  - .obsidian