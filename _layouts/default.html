<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Each page sets its own title and description in its front matter -->
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Tab icons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <!-- Fonts: change them here once and every page updates -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css?v={{ site.time | date: '%s' }}">
</head>
<body>

{{ content }}

{% include footer.html %}

</body>
</html>
