<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Each page sets its own title and description in its front matter -->
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% assign desc = page.description | default: page.subtitle | default: site.description %}
  <meta name="description" content="{{ desc }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Link preview card for LinkedIn, Facebook, X and messaging apps.
       A post can use its own picture by adding  image: /images/post/your-image.jpg
       to its properties (ideally 1200 x 630 pixels). -->
  {% assign preview = page.image | default: "/images/social-preview.jpg" %}
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ desc }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ preview }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:locale" content="en_AU">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Tab icons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <!-- Fonts: change them here once and every page updates -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- The ?v= part changes on every build so browsers fetch the newest styles -->
  <link rel="stylesheet" href="/style.css?v={{ site.time | date: '%s' }}">
</head>
<body>

{{ content }}

{% include footer.html %}

</body>
</html>
